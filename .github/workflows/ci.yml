name: ci

# 阻断项：lint / build / compose-check；条件项：test（tests/ 存在才跑）；观察项：secret-scan
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.17.1"
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        # 94 个存量文件尚未格式化，格式化是独立 PR 的工作；先只报告不阻断。
        continue-on-error: true
        run: ruff format --check .

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: |
          docker build -t wb2api:ci .
          docker image inspect wb2api:ci --format 'size={{.Size}}'
      - name: import smoke test
        # 构建成功 ≠ 能启动：直接 import app 对象，捕获缺依赖/语法错误。
        # 用一次性 sqlite，避免默认 mysql URL 在 import 阶段尝试连库。
        run: |
          docker run --rm -e ADMIN_DATABASE_URL=sqlite:////tmp/ci.db \
            wb2api:ci python3 -c "import admin.server; print('import ok')"

  compose-check:
    name: compose-check
    runs-on: ubuntu-latest
    env:
      ADMIN_USERNAME: ci
      ADMIN_PASSWORD: ci-password
      ADMIN_JWT_SECRET: ci-jwt-secret
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose -f docker-compose.dsh.yml config --quiet
      - name: forbid image field in deploy compose
        # 写了 image: 时 Portainer 部署前会 compose pull 本地镜像 → pull access denied
        run: |
          if grep -qE '^[[:space:]]+image:' docker-compose.dsh.yml; then
            echo "::error file=docker-compose.dsh.yml::不要写 image 字段，只用 build:（否则 Portainer 会去 registry 拉不存在的镜像）"
            exit 1
          fi
          echo "compose 未声明 image 字段，OK"

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: detect tests
        # tests/ 迁移完成前不跑，但 job 必须存在（否则 ruleset 的 required check 会一直 pending）
        id: detect
        run: |
          if compgen -G "tests/*.py" > /dev/null; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过测试::仓库里还没有 tests/*.py，测试套件迁移后本 job 自动生效"
          fi
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.has_tests == 'true'
        with:
          python-version: "3.12"
      - name: Install deps
        if: steps.detect.outputs.has_tests == 'true'
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check
      - name: unittest discover
        if: steps.detect.outputs.has_tests == 'true'
        run: python -m unittest discover -s tests -t .

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
