name: sync-upstream

# 上游 xiaofan6ya/wb2api → 本仓库 master。
#
# 我们是上游的真 fork（共享父提交），普通 merge 即可。
#
# 设计要点：master 上不设合并闸门（ruleset 只保留 force-push / 删除保护），
# 于是把「闸门」搬到推送之前：先在 runner 里跑一遍与 CI 相同的检查，全绿才 push。
# 上游发的东西坏掉时，本次同步中止，master 与线上都不受影响 —— 你只收到一封失败通知。
on:
  schedule:
    - cron: "0 3 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/xiaofan6ya/wb2api.git

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # compose 里的 ${VAR:?} 是必填校验；自检阶段给占位值
      ADMIN_USERNAME: ci
      ADMIN_PASSWORD: ci-password
      ADMIN_JWT_SECRET: ci-jwt-secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe upstream
        id: probe
        run: |
          set +e
          if GIT_TERMINAL_PROMPT=0 git ls-remote --heads "$UPSTREAM_REPO" master 2>/dev/null | grep -q master; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=上游不可达::${UPSTREAM_REPO} 无法访问，跳过本次同步（不影响本仓库与部署）。"
          fi

      - name: Configure git
        if: steps.probe.outputs.reachable == 'true'
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"

      - name: Merge upstream
        id: merge
        if: steps.probe.outputs.reachable == 'true'
        run: |
          git remote add upstream "$UPSTREAM_REPO" || true
          git fetch upstream master
          echo "upstream=$(git rev-parse --short upstream/master) local=$(git rev-parse --short HEAD)"
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=已是最新::上游没有新提交，本次不做任何改动。"
            exit 0
          fi
          if ! git merge upstream/master --no-edit -m "chore: sync upstream wb2api"; then
            git --no-pager diff --name-only --diff-filter=U | head -20
            git merge --abort || true
            echo "::error title=合并冲突::上游改动与本地文件冲突，已中止合并，未推送任何内容。"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.merge.outputs.changed == 'true'
        with:
          python-version: "3.12"

      - name: Refresh dependency lock
        # 上游若改了依赖，锁必须跟着走：pip-compile 输出文件已存在时会保留旧 pin，
        # 只新增缺的包、只提升被新约束强制影响的包。
        if: steps.merge.outputs.changed == 'true'
        run: |
          if cmp -s requirements.txt requirements.in; then
            echo "::notice title=依赖未变::requirements.txt 与 requirements.in 一致，锁保持不变。"
            exit 0
          fi
          echo "上游改动了依赖，按现有 pin 重新解析（只动受影响的包）"
          cp requirements.txt requirements.in
          python -m pip install --disable-pip-version-check "pip-tools==7.6.2"
          pip-compile requirements.in --output-file requirements.lock --strip-extras --quiet
          git add requirements.in requirements.lock
          git commit -m "build(deps): 跟随上游刷新依赖锁" || echo "::notice title=锁无变化::重新解析结果与原锁一致。"
          git --no-pager diff --stat HEAD~1 HEAD || true

      - name: Gate 1/4 ruff
        if: steps.merge.outputs.changed == 'true'
        run: |
          python -m pip install --disable-pip-version-check "ruff==0.17.1"
          ruff check .
          ruff format --check . || echo "::warning title=format::存量文件未格式化（非阻断）"

      - name: Gate 2/4 compose config
        if: steps.merge.outputs.changed == 'true'
        run: docker compose -f docker-compose.dsh.yml config --quiet

      - name: Gate 3/4 docker build + import
        if: steps.merge.outputs.changed == 'true'
        run: |
          docker build -t wb2api:sync .
          docker run --rm -e ADMIN_DATABASE_URL=sqlite:////tmp/ci.db \
            wb2api:sync python3 -c "import admin.server; print('import ok')"

      - name: Gate 4/4 tests
        if: steps.merge.outputs.changed == 'true'
        run: |
          if compgen -G "tests/*.py" > /dev/null; then
            # 直接在构建好的镜像里跑，省一次依赖安装
            docker run --rm \
              -e ADMIN_REDIS_URL= -e ADMIN_GATEWAY_LIMIT_BACKEND=memory \
              -v "$PWD:/src" -w /src wb2api:sync \
              python3 -m unittest discover -s tests -t .
          else
            echo "::notice title=跳过测试::仓库里没有 tests/*.py"
          fi

      - name: Push
        if: steps.merge.outputs.changed == 'true'
        run: |
          git push origin HEAD:master
          echo "::notice title=已同步::自检全绿并已推送 master；Portainer 下一轮轮询会重建镜像并重启容器。"
