# Ruff 基线配置（P0-5）
#
# 存量代码在启用规则集 E,F,W,I,B（line-length=120）时会一次性暴露 542 条告警，
# 分布在 72 个文件，归并为 162 个「文件 × 规则」组合。整改这些存量问题是独立的「清理/格式化」PR，
# 不应与 CI 建设混在一起，因此这里把**当前已存在的**逐文件逐规则冻结。
#
# 规则：冻结清单只减不增。
#   - 新文件不在下表 => 必须零告警
#   - 每修完一个文件的存量问题，就从下表删掉对应条目
#   - 不得为了让新代码变绿而把新文件加进下表
#
# 格式检查（ruff format --check）暂未纳入阻断：91 个存量文件尚未统一格式，
# 见本目录 README 的已知风险一节。

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
